# ============================================================
# Weather Bot — GitHub Actions Workflow
# ============================================================
# This file runs your weather bot automatically in the cloud
# for FREE using GitHub Actions. No VPS or server needed.
#
# Schedule:
#   • Bitcoin Club Malta Weather  — 07:30 CET daily (Mon-Fri) = 05:30 UTC
#   • Roatan Weather Bot          — 06:30 CST daily (Mon-Fri) = 12:30 UTC
#   • Both accounts               — Weekly summary on Sundays
#
# Setup: Add these secrets in your GitHub repo under
#   Settings → Secrets and variables → Actions → New repository secret
#
#   OWM_API_KEY
#   BCM_X_API_KEY, BCM_X_API_SECRET, BCM_X_ACCESS_TOKEN, BCM_X_ACCESS_SECRET
#   BCM_LI_ACCESS_TOKEN, BCM_LI_AUTHOR_URN
#   ROA_X_API_KEY, ROA_X_API_SECRET, ROA_X_ACCESS_TOKEN, ROA_X_ACCESS_SECRET
#   ROA_LI_ACCESS_TOKEN, ROA_LI_AUTHOR_URN
#   NOSTR_NSEC
# ============================================================

name: Weather Bot Posts

on:
  schedule:
    # ── Bitcoin Club Malta Weather — 07:30 CET (05:30 UTC) Mon-Fri ──
    - cron: '30 5 * * 1-5'

    # ── Roatan Weather Bot — 06:30 CST (12:30 UTC) Mon-Fri ──
    - cron: '30 12 * * 1-5'

    # ── BCM Weekend — Saturday 08:00 CET (06:00 UTC) ──
    - cron: '0 6 * * 6'

    # ── Roatan Weekend — Saturday 07:00 CST (13:00 UTC) ──
    - cron: '0 13 * * 6'

    # ── BCM Weekly Summary — Sunday 09:00 CET (07:00 UTC) ──
    - cron: '0 7 * * 0'

    # ── Roatan Weekly Summary — Sunday 09:00 CST (15:00 UTC) ──
    - cron: '0 15 * * 0'

  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:
    inputs:
      account:
        description: 'Which account to post for'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - bcm
          - roatan
      post_type:
        description: 'Type of post'
        required: true
        default: 'daily'
        type: choice
        options:
          - daily
          - weekly
          - alert
      message:
        description: 'Alert message (only used when post_type = alert)'
        required: false
        default: ''

jobs:
  post-bcm-daily:
    name: BCM Daily Forecast (Mon-Fri 07:30 CET)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' && github.event.schedule == '30 5 * * 1-5'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Post BCM daily forecast
        env:
          OWM_API_KEY: ${{ secrets.OWM_API_KEY }}
          BCM_X_API_KEY: ${{ secrets.BCM_X_API_KEY }}
          BCM_X_API_SECRET: ${{ secrets.BCM_X_API_SECRET }}
          BCM_X_ACCESS_TOKEN: ${{ secrets.BCM_X_ACCESS_TOKEN }}
          BCM_X_ACCESS_SECRET: ${{ secrets.BCM_X_ACCESS_SECRET }}
          BCM_LI_ACCESS_TOKEN: ${{ secrets.BCM_LI_ACCESS_TOKEN }}
          BCM_LI_AUTHOR_URN: ${{ secrets.BCM_LI_AUTHOR_URN }}
          NOSTR_NSEC: ${{ secrets.NOSTR_NSEC }}
        run: python weather_bot.py --account bcm --type daily

  post-roatan-daily:
    name: Roatan Daily Forecast (Mon-Fri 06:30 CST)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' && github.event.schedule == '30 12 * * 1-5'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Post Roatan daily forecast
        env:
          OWM_API_KEY: ${{ secrets.OWM_API_KEY }}
          ROA_X_API_KEY: ${{ secrets.ROA_X_API_KEY }}
          ROA_X_API_SECRET: ${{ secrets.ROA_X_API_SECRET }}
          ROA_X_ACCESS_TOKEN: ${{ secrets.ROA_X_ACCESS_TOKEN }}
          ROA_X_ACCESS_SECRET: ${{ secrets.ROA_X_ACCESS_SECRET }}
          ROA_LI_ACCESS_TOKEN: ${{ secrets.ROA_LI_ACCESS_TOKEN }}
          ROA_LI_AUTHOR_URN: ${{ secrets.ROA_LI_AUTHOR_URN }}
          NOSTR_NSEC: ${{ secrets.NOSTR_NSEC }}
        run: python weather_bot.py --account roatan --type daily

  post-bcm-weekend:
    name: BCM Weekend Forecast (Sat 08:00 CET)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' && github.event.schedule == '0 6 * * 6'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Post BCM weekend forecast
        env:
          OWM_API_KEY: ${{ secrets.OWM_API_KEY }}
          BCM_X_API_KEY: ${{ secrets.BCM_X_API_KEY }}
          BCM_X_API_SECRET: ${{ secrets.BCM_X_API_SECRET }}
          BCM_X_ACCESS_TOKEN: ${{ secrets.BCM_X_ACCESS_TOKEN }}
          BCM_X_ACCESS_SECRET: ${{ secrets.BCM_X_ACCESS_SECRET }}
          BCM_LI_ACCESS_TOKEN: ${{ secrets.BCM_LI_ACCESS_TOKEN }}
          BCM_LI_AUTHOR_URN: ${{ secrets.BCM_LI_AUTHOR_URN }}
          NOSTR_NSEC: ${{ secrets.NOSTR_NSEC }}
        run: python weather_bot.py --account bcm --type daily

  post-roatan-weekend:
    name: Roatan Weekend Forecast (Sat 07:00 CST)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' && github.event.schedule == '0 13 * * 6'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Post Roatan weekend forecast
        env:
          OWM_API_KEY: ${{ secrets.OWM_API_KEY }}
          ROA_X_API_KEY: ${{ secrets.ROA_X_API_KEY }}
          ROA_X_API_SECRET: ${{ secrets.ROA_X_API_SECRET }}
          ROA_X_ACCESS_TOKEN: ${{ secrets.ROA_X_ACCESS_TOKEN }}
          ROA_X_ACCESS_SECRET: ${{ secrets.ROA_X_ACCESS_SECRET }}
          ROA_LI_ACCESS_TOKEN: ${{ secrets.ROA_LI_ACCESS_TOKEN }}
          ROA_LI_AUTHOR_URN: ${{ secrets.ROA_LI_AUTHOR_URN }}
          NOSTR_NSEC: ${{ secrets.NOSTR_NSEC }}
        run: python weather_bot.py --account roatan --type daily

  post-bcm-weekly:
    name: BCM Weekly Summary (Sun 09:00 CET)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' && github.event.schedule == '0 7 * * 0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Post BCM weekly summary
        env:
          OWM_API_KEY: ${{ secrets.OWM_API_KEY }}
          BCM_X_API_KEY: ${{ secrets.BCM_X_API_KEY }}
          BCM_X_API_SECRET: ${{ secrets.BCM_X_API_SECRET }}
          BCM_X_ACCESS_TOKEN: ${{ secrets.BCM_X_ACCESS_TOKEN }}
          BCM_X_ACCESS_SECRET: ${{ secrets.BCM_X_ACCESS_SECRET }}
          BCM_LI_ACCESS_TOKEN: ${{ secrets.BCM_LI_ACCESS_TOKEN }}
          BCM_LI_AUTHOR_URN: ${{ secrets.BCM_LI_AUTHOR_URN }}
          NOSTR_NSEC: ${{ secrets.NOSTR_NSEC }}
        run: python weather_bot.py --account bcm --type weekly

  post-roatan-weekly:
    name: Roatan Weekly Summary (Sun 09:00 CST)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' && github.event.schedule == '0 15 * * 0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Post Roatan weekly summary
        env:
          OWM_API_KEY: ${{ secrets.OWM_API_KEY }}
          ROA_X_API_KEY: ${{ secrets.ROA_X_API_KEY }}
          ROA_X_API_SECRET: ${{ secrets.ROA_X_API_SECRET }}
          ROA_X_ACCESS_TOKEN: ${{ secrets.ROA_X_ACCESS_TOKEN }}
          ROA_X_ACCESS_SECRET: ${{ secrets.ROA_X_ACCESS_SECRET }}
          ROA_LI_ACCESS_TOKEN: ${{ secrets.ROA_LI_ACCESS_TOKEN }}
          ROA_LI_AUTHOR_URN: ${{ secrets.ROA_LI_AUTHOR_URN }}
          NOSTR_NSEC: ${{ secrets.NOSTR_NSEC }}
        run: python weather_bot.py --account roatan --type weekly

  post-manual:
    name: Manual Post (triggered from GitHub UI)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Post manual
        env:
          OWM_API_KEY: ${{ secrets.OWM_API_KEY }}
          BCM_X_API_KEY: ${{ secrets.BCM_X_API_KEY }}
          BCM_X_API_SECRET: ${{ secrets.BCM_X_API_SECRET }}
          BCM_X_ACCESS_TOKEN: ${{ secrets.BCM_X_ACCESS_TOKEN }}
          BCM_X_ACCESS_SECRET: ${{ secrets.BCM_X_ACCESS_SECRET }}
          BCM_LI_ACCESS_TOKEN: ${{ secrets.BCM_LI_ACCESS_TOKEN }}
          BCM_LI_AUTHOR_URN: ${{ secrets.BCM_LI_AUTHOR_URN }}
          ROA_X_API_KEY: ${{ secrets.ROA_X_API_KEY }}
          ROA_X_API_SECRET: ${{ secrets.ROA_X_API_SECRET }}
          ROA_X_ACCESS_TOKEN: ${{ secrets.ROA_X_ACCESS_TOKEN }}
          ROA_X_ACCESS_SECRET: ${{ secrets.ROA_X_ACCESS_SECRET }}
          ROA_LI_ACCESS_TOKEN: ${{ secrets.ROA_LI_ACCESS_TOKEN }}
          ROA_LI_AUTHOR_URN: ${{ secrets.ROA_LI_AUTHOR_URN }}
          NOSTR_NSEC: ${{ secrets.NOSTR_NSEC }}
        run: |
          python weather_bot.py \
            --account "${{ github.event.inputs.account }}" \
            --type "${{ github.event.inputs.post_type }}" \
            --message "${{ github.event.inputs.message }}"
